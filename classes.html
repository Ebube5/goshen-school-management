<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Management | Goshen School</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #263445;
}

header {
    background: #172b4d;
    color: white;
    padding: 20px;
}

header h2 {
    margin-bottom: 15px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
}

nav a {
    color: white;
    text-decoration: none;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

h2 {
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.stats {
    border-left: 5px solid #172b4d;
}

.stats p {
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: 1px solid #d5dce5;
    border-radius: 5px;
    font-size: 15px;
}

button {
    background: #172b4d;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
    margin-top: 15px;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

th {
    background: #edf1f6;
}

.actions button {
    width: auto;
    padding: 8px 12px;
    margin-right: 5px;
}

.delete {
    background: #b42318;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width: 600px) {
    .container {
        margin: 15px auto;
    }
}
</style>
</head>

<body>

<header>
    <h2>Goshen School Management</h2>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="teachers.html">Teachers</a>
        <a href="classes.html">Classes</a>
    </nav>
</header>

<main class="container">

    <h2>Class Management</h2>

    <div class="card stats">
        <h3>Total Classes</h3>
        <p id="totalClasses">0</p>
    </div>

    <div class="card">

        <h3 id="formTitle">Create New Class</h3>

        <form id="classForm">

            <input type="hidden" id="editIndex">

            <input
                type="text"
                id="className"
                placeholder="Class Name (e.g. JSS1)"
                required
            >

            <select id="formTeacher">
                <option value="">Select Form Teacher</option>
            </select>

            <button type="submit" id="submitBtn">
                Create Class
            </button>

        </form>

    </div>

    <div class="card">

        <h3>Registered Classes</h3>

        <div class="table-wrap">

            <table>
                <thead>
                    <tr>
                        <th>Class Name</th>
                        <th>Form Teacher</th>
                        <th>Students</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="classList"></tbody>

            </table>

        </div>

    </div>

</main>

<script>
let classes = JSON.parse(
    localStorage.getItem("goshenClasses") || "[]"
);

let teachers = JSON.parse(
    localStorage.getItem("goshenTeachers") || "[]"
);

let students = JSON.parse(
    localStorage.getItem("goshenStudents") || "[]"
);

const form = document.getElementById("classForm");

function saveClasses() {
    localStorage.setItem(
        "goshenClasses",
        JSON.stringify(classes)
    );
}

function loadTeachers() {
    const select = document.getElementById("formTeacher");

    teachers.forEach(teacher => {
        const option = document.createElement("option");

        option.value = teacher.name;
        option.textContent = teacher.name;

        select.appendChild(option);
    });
}

function getStudentPopulation(className) {
    return students.filter(student => {
        const studentClass =
            student.className || student.class || "";

        return studentClass.trim().toLowerCase() ===
            className.trim().toLowerCase();
    }).length;
}

function displayClasses() {

    const list = document.getElementById("classList");

    list.innerHTML = "";

    document.getElementById("totalClasses").textContent =
        classes.length;

    if (classes.length === 0) {
        list.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    No classes have been created yet.
                </td>
            </tr>
        `;
        return;
    }

    classes.forEach((item, index) => {

        const row = document.createElement("tr");

        const name = document.createElement("td");
        name.textContent = item.name;

        const teacher = document.createElement("td");
        teacher.textContent = item.teacher || "Not assigned";

        const population = document.createElement("td");
        population.textContent =
            getStudentPopulation(item.name);

        const actions = document.createElement("td");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = () => editClass(index);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.onclick = () => deleteClass(index);

        actions.append(editButton, deleteButton);

        row.append(name, teacher, population, actions);

        list.appendChild(row);

    });
}

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("className")
        .value.trim();

    const teacher = document.getElementById("formTeacher").value;

    const editIndex =
        document.getElementById("editIndex").value;

    const duplicate = classes.some((item, index) =>
        item.name.toLowerCase() === name.toLowerCase() &&
        index !== (editIndex === "" ? -1 : Number(editIndex))
    );

    if (duplicate) {
        alert("This class already exists.");
        return;
    }

    const record = {
        name: name,
        teacher: teacher
    };

    if (editIndex === "") {
        classes.push(record);
        alert("Class created successfully!");
    } else {
        classes[Number(editIndex)] = record;
        alert("Class updated successfully!");
    }

    saveClasses();

    form.reset();

    document.getElementById("editIndex").value = "";

    document.getElementById("formTitle").textContent =
        "Create New Class";

    document.getElementById("submitBtn").textContent =
        "Create Class";

    displayClasses();

});

function editClass(index) {

    const item = classes[index];

    document.getElementById("className").value = item.name;

    document.getElementById("formTeacher").value =
        item.teacher || "";

    document.getElementById("editIndex").value = index;

    document.getElementById("formTitle").textContent =
        "Edit Class";

    document.getElementById("submitBtn").textContent =
        "Update Class";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function deleteClass(index) {

    if (confirm("Are you sure you want to delete this class?")) {

        classes.splice(index, 1);

        saveClasses();

        displayClasses();
    }
}

loadTeachers();
displayClasses();

</script>

</body>
</html>
