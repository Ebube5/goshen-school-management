<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management | Goshen School</title>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #263445;
}

header {
    background: #172b4d;
    color: white;
    padding: 20px;
}

header h2 {
    margin-bottom: 15px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

h2 {
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.stat {
    background: #f4f6f9;
    padding: 18px;
    border-radius: 6px;
}

.stat p {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: 1px solid #d5dce5;
    border-radius: 5px;
    font-size: 15px;
}

button {
    background: #172b4d;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
    margin-top: 15px;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}
