<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management | Goshen SMS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #263247;
}

header {
    background: #172b4d;
    color: white;
    padding: 20px;
}

header h2 {
    font-size: 21px;
}

header p {
    font-size: 13px;
    margin-top: 5px;
    color: #cbd5e1;
}

main {
    padding: 25px;
    max-width: 1200px;
    margin: auto;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 12px;
}

.top h2 {
    font-size: 23px;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
}

.add-btn {
    background: #173b69;
    color: white;
}

.summary {
    background: white;
    padding: 22px;
    border: 1px solid #e1e5eb;
    border-radius: 5px;
    margin-bottom: 25px;
}

.summary p {
    color: #778195;
    font-size: 13px;
}

.summary h2 {
    margin-top: 12px;
    font-size: 27px;
}

.form-box, .table-box {
    background: white;
    padding: 22px;
    border: 1px solid #e1e5eb;
    border-radius: 5px;
    margin-bottom: 25px;
}

.form-box h3, .table-box h3 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 7px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #dce1e8;
    border-radius: 4px;
    outline: none;
    background: white;
}

input:focus, select:focus {
    border-color: #173b69;
}

.form-actions {
    margin-top: 20px;
}

.save-btn {
    background: #173b69;
    color: white;
}

.cancel-btn {
    background: #e9edf2;
    color: #263247;
}

.search {
    margin-bottom: 18px;
    max-width: 400px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th, td {
    padding: 14px 10px;
    border-bottom: 1px solid #edf0f4;
    text-align: left;
    font-size: 13px;
}

th {
    background: #f8f9fb;
    color: #667085;
}

.edit-btn {
    background: #e5edf8;
    color: #173b69;
    margin-right: 4px;
}

.delete-btn {
    background: #fce8e8;
    color: #b42318;
}

#studentForm {
    display: none;
}

@media(max-width: 600px) {
    main {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .top {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h2>GOSHEN</h2>
    <p>School Management System</p>
</header>

<main>

    <div class="top">
        <div>
            <h2>Student Management</h2>
            <p>Manage registered students and records.</p>
        </div>

        <button class="add-btn" onclick="showForm()">
            + Register Student
        </button>
    </div>

    <section class="summary">
        <p>Total Registered Students</p>
        <h2 id="totalStudents">0</h2>
    </section>

    <section class="form-box" id="studentForm">

        <h3 id="formTitle">Register New Student</h3>

        <form onsubmit="saveStudent(event)">

            <div class="form-grid">

                <div>
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>

                <div>
                    <label>Admission Number</label>
                    <input type="text" id="admission" readonly>
                </div>

                <div>
                    <label>Class</label>
                    <select id="className" required>
                        <option value="">Select Class</option>
                        <option>JSS 1</option>
                        <option>JSS 2</option>
                        <option>JSS 3</option>
                        <option>SS 1</option>
                        <option>SS 2</option>
                        <option>SS 3</option>
                    </select>
                </div>

                <div>
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div>
                    <label>Parent/Guardian Name</label>
                    <input type="text" id="parent" required>
                </div>

                <div>
                    <label>Parent Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="save-btn">
                    Save Student
                </button>

                <button type="button" class="cancel-btn"
                onclick="hideForm()">
                    Cancel
                </button>
            </div>

        </form>
    </section>

    <section class="table-box">

        <h3>Registered Students</h3>

        <input
            type="search"
            class="search"
            id="search"
            placeholder="Search by name or admission number..."
            oninput="displayStudents()"
        >

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Admission No.</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>
            </table>
        </div>

    </section>

</main>

<script>

let students = JSON.parse(
    localStorage.getItem("goshenStudents") || "[]"
);

let editingIndex = -1;

function updateStorage() {
    localStorage.setItem(
        "goshenStudents",
        JSON.stringify(students)
    );
}

function generateAdmission() {
    return "GSH/" + new Date().getFullYear() + "/" +
    String(Date.now()).slice(-6);
}

function showForm() {
    editingIndex = -1;

    document.querySelector("form").reset();

    document.getElementById("formTitle").textContent =
        "Register New Student";

    document.getElementById("admission").value =
        generateAdmission();

    document.getElementById("studentForm").style.display =
        "block";
}

function hideForm() {
    document.getElementById("studentForm").style.display =
        "none";
}

function saveStudent(event) {
    event.preventDefault();

    const student = {
        name: document.getElementById("name").value.trim(),
        admission: document.getElementById("admission").value,
        className: document.getElementById("className").value,
        gender: document.getElementById("gender").value,
        parent: document.getElementById("parent").value.trim(),
        phone: document.getElementById("phone").value.trim()
    };

    if (editingIndex === -1) {
        students.push(student);
    } else {
        students[editingIndex] = student;
    }

    updateStorage();
    displayStudents();
    hideForm();
}

function displayStudents() {
    const list = document.getElementById("studentList");

    const search = document.getElementById("search")
        .value.toLowerCase();

    const filtered = students.filter(student =>
        student.name.toLowerCase().includes(search) ||
        student.admission.toLowerCase().includes(search)
    );

    document.getElementById("totalStudents").textContent =
        students.length;

    list.innerHTML = "";

    filtered.forEach(student => {

        const index = students.indexOf(student);

        list.innerHTML += `
            <tr>
                <td>${student.admission}</td>
                <td>${escapeHTML(student.name)}</td>
                <td>${escapeHTML(student.className)}</td>
                <td>${escapeHTML(student.gender)}</td>
                <td>
                    <button class="edit-btn"
                    onclick="editStudent(${index})">
                        Edit
                    </button>

                    <button class="delete-btn"
                    onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });

    if (filtered.length === 0) {
        list.innerHTML = `
            <tr>
                <td colspan="5">No students found.</td>
            </tr>
        `;
    }
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function editStudent(index) {
    const student = students[index];

    editingIndex = index;

    document.getElementById("name").value = student.name;
    document.getElementById("admission").value = student.admission;
    document.getElementById("className").value = student.className;
    document.getElementById("gender").value = student.gender;
    document.getElementById("parent").value = student.parent;
    document.getElementById("phone").value = student.phone;

    document.getElementById("formTitle").textContent =
        "Edit Student Information";

    document.getElementById("studentForm").style.display =
        "block";

    window.scrollTo(0, 0);
}

function deleteStudent(index) {
    if (confirm("Are you sure you want to delete this student?")) {
        students.splice(index, 1);
        updateStorage();
        displayStudents();
    }
}

displayStudents();

</script>

</body>
  </html>
