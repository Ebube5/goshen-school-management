<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Management | Goshen School</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #263445;
}

header {
    background: #172b4d;
    color: white;
    padding: 20px;
}

header a {
    color: white;
    text-decoration: none;
    margin-right: 15px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

h2 {
    margin-bottom: 20px;
}

.stats, .card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.stats {
    border-left: 5px solid #172b4d;
}

.stats h3 {
    color: #64748b;
    font-size: 15px;
}

.stats p {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #d5dce5;
    border-radius: 5px;
    font-size: 15px;
}

button {
    background: #172b4d;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #edf1f6;
}

.table-wrap {
    overflow-x: auto;
}

.actions button {
    width: auto;
    padding: 7px 10px;
    margin: 3px;
}

.delete {
    background: #b42318;
}

@media(max-width: 600px) {
    .container {
        margin: 15px auto;
    }
}
</style>
</head>

<body>

<header>
    <h2>Goshen School Management</h2>
    <br>
    <a href="index.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="teachers.html">Teachers</a>
</header>

<div class="container">

    <h2>Teacher Management</h2>

    <div class="stats">
        <h3>Total Registered Teachers</h3>
        <p id="totalTeachers">0</p>
    </div>

    <div class="card">
        <h3 id="formTitle">Register New Teacher</h3>

        <form id="teacherForm">

            <input type="hidden" id="editIndex">

            <input type="text" id="teacherName"
            placeholder="Full Name" required>

            <input type="tel" id="teacherPhone"
            placeholder="Phone Number" required>

            <input type="email" id="teacherEmail"
            placeholder="Email Address">

            <select id="teacherGender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <input type="text" id="teacherSubject"
            placeholder="Subject Taught" required>

            <input type="text" id="teacherClass"
            placeholder="Assigned Class" required>

            <button type="submit" id="submitBtn">
                Register Teacher
            </button>

        </form>
    </div>

    <div class="card">
        <h3>Registered Teachers</h3>

        <input type="search" id="searchTeacher"
        placeholder="Search by name, subject or class">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="teacherList"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
let teachers = JSON.parse(
    localStorage.getItem("goshenTeachers") || "[]"
);

const form = document.getElementById("teacherForm");

function saveTeachers() {
    localStorage.setItem(
        "goshenTeachers",
        JSON.stringify(teachers)
    );
}

function displayTeachers(search = "") {
    const list = document.getElementById("teacherList");
    list.innerHTML = "";

    const filtered = teachers
        .map((teacher, index) => ({teacher, index}))
        .filter(({teacher}) =>
            `${teacher.name} ${teacher.subject} ${teacher.className}`
            .toLowerCase().includes(search.toLowerCase())
        );

    filtered.forEach(({teacher, index}) => {
        const row = document.createElement("tr");

        [teacher.name, teacher.phone,
         teacher.subject, teacher.className].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const actions = document.createElement("td");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.onclick = () => editTeacher(index);

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.className = "delete";
        remove.onclick = () => deleteTeacher(index);

        actions.append(edit, remove);
        row.appendChild(actions);
        list.appendChild(row);
    });

    document.getElementById("totalTeachers").textContent =
        teachers.length;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const teacher = {
        name: document.getElementById("teacherName").value.trim(),
        phone: document.getElementById("teacherPhone").value.trim(),
        email: document.getElementById("teacherEmail").value.trim(),
        gender: document.getElementById("teacherGender").value,
        subject: document.getElementById("teacherSubject").value.trim(),
        className: document.getElementById("teacherClass").value.trim()
    };

    const editIndex = document.getElementById("editIndex").value;

    if (editIndex === "") {
        teachers.push(teacher);
        alert("Teacher registered successfully!");
    } else {
        teachers[Number(editIndex)] = teacher;
        alert("Teacher record updated!");
    }

    saveTeachers();
    form.reset();
    document.getElementById("editIndex").value = "";
    document.getElementById("formTitle").textContent =
        "Register New Teacher";
    document.getElementById("submitBtn").textContent =
        "Register Teacher";

    displayTeachers(
        document.getElementById("searchTeacher").value
    );
});

function editTeacher(index) {
    const teacher = teachers[index];

    document.getElementById("teacherName").value = teacher.name;
    document.getElementById("teacherPhone").value = teacher.phone;
    document.getElementById("teacherEmail").value = teacher.email;
    document.getElementById("teacherGender").value = teacher.gender;
    document.getElementById("teacherSubject").value = teacher.subject;
    document.getElementById("teacherClass").value = teacher.className;

    document.getElementById("editIndex").value = index;
    document.getElementById("formTitle").textContent = "Edit Teacher";
    document.getElementById("submitBtn").textContent = "Update Teacher";

    window.scrollTo({top: 0, behavior: "smooth"});
}

function deleteTeacher(index) {
    if (confirm("Are you sure you want to delete this teacher?")) {
        teachers.splice(index, 1);
        saveTeachers();
        displayTeachers(
            document.getElementById("searchTeacher").value
        );
    }
}

document.getElementById("searchTeacher")
.addEventListener("input", function() {
    displayTeachers(this.value);
});

displayTeachers();
</script>

</body>
  </html>
